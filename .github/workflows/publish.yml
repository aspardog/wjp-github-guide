name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para que la action escriba en gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Descomenta este bloque si vas a tener chunks de R que se ejecutan al renderizar.
      # Si solo usás Markdown (sin código ejecutable), podés dejarlo comentado y
      # el build será mucho más rápido.
      #
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      #   with:
      #     r-version: 'release'
      # - name: Install R packages
      #   uses: r-lib/actions/setup-renv@v2

      # Descomenta si vas a usar chunks de Python ejecutables
      #
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - name: Install Python packages
      #   run: |
      #     pip install jupyter
      #     pip install -r requirements.txt

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
